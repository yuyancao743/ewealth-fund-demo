<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户列表 · eWealth Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1677ff; --primary-hover: #4096ff;
      --text: #262626; --text-2: #595959; --text-3: #8c8c8c;
      --line: #f0f0f0; --border: #d9d9d9; --bg: #f5f7fa; --header: #0f1724;
      --drawer-w: 520px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--primary-hover); }
    button, input, select { font-family: inherit; }
    .topbar {
      height: 56px; background: var(--header); color: #fff;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
      position: sticky; top: 0; z-index: 40;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex; align-items: center; justify-content: center; font-size: 13px;
    }
    .brand em { font-style: normal; font-weight: 500; opacity: .85; margin-left: 4px; }
    .top-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: rgba(255,255,255,.85); }
    .icon-btn { width: 32px; height: 32px; border: none; background: transparent; color: #fff; border-radius: 8px; cursor: pointer; font-size: 15px; }
    .ccy { height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.1); display: inline-flex; align-items: center; gap: 6px; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
    .user { display: flex; align-items: center; gap: 8px; }
    .page { padding: 16px 20px 32px; }
    .proto { margin-bottom: 12px; font-size: 12px; color: var(--text-3); }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04); border: 1px solid var(--line); }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px 20px; }
    .input { height: 32px; width: 220px; padding: 0 11px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
    .btn { height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 12px 14px; color: var(--text-2); font-weight: 600; background: #fafafa; border-top: 1px solid var(--line); white-space: nowrap; }
    td { padding: 14px; border-top: 1px solid var(--line); vertical-align: middle; }
    tr:nth-child(even) td { background: #fafafa; }
    .drag { color: #bfbfbf; margin-right: 8px; }
    .name-stack { display: flex; flex-direction: column; gap: 2px; }
    .name-cell { display: flex; align-items: center; gap: 8px; }
    .info-ico {
      width: 24px; height: 24px; border: none; background: #e6f4ff; color: var(--primary);
      border-radius: 50%; cursor: pointer; font-size: 12px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .info-ico:hover { background: var(--primary); color: #fff; }
    .copy { color: var(--text-3); margin-left: 6px; cursor: pointer; font-size: 12px; }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; }
    .pill-yes { background: #e6f4ff; color: #1677ff; }
    .pill-no { background: #f5f5f5; color: #8c8c8c; }
    .op { color: var(--text-3); font-size: 16px; }
    .op:hover { color: var(--primary); }
    .title-actions { display: flex; align-items: center; gap: 10px; }
    .reveal-all { border: none; background: none; color: var(--primary); cursor: pointer; font-size: 16px; padding: 0; }
    .pager-btns { display: flex; align-items: center; gap: 8px; }
    select.mini { height: 28px; border: 1px solid var(--border); border-radius: 6px; padding: 0 8px; font-size: 12px; }
    .pager { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; color: var(--text-3); font-size: 13px; }
    .page-num { width: 28px; height: 28px; border: 1px solid var(--primary); background: var(--primary); color: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .mask { display: none; position: fixed; inset: 56px 0 0 0; background: rgba(15,23,36,.28); z-index: 50; }
    body.info-open .mask { display: block; }
    .drawer {
      position: fixed; top: 56px; right: 0; bottom: 0; width: var(--drawer-w); background: #fff;
      box-shadow: -8px 0 28px rgba(15,23,36,.18); transform: translateX(100%);
      transition: transform .28s ease; z-index: 60; display: flex; flex-direction: column;
    }
    body.info-open .drawer { transform: translateX(0); }
    .drawer-head { padding: 16px 18px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .drawer-head h2 { font-size: 16px; font-weight: 650; }
    .drawer-head .sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }
    .close { width: 32px; height: 32px; border: none; background: #f5f5f5; border-radius: 6px; cursor: pointer; }
    .drawer-nav { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fafafa; }
    .nav-item { height: 30px; padding: 0 10px; border: none; background: none; border-radius: 6px; font-size: 12px; color: var(--text-2); cursor: pointer; }
    .nav-item.active { background: #fff; color: var(--primary); font-weight: 600; box-shadow: 0 0 0 1px #91caff; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 12px 18px 32px; }
    .readonly-tip { font-size: 11px; color: var(--text-3); padding: 10px 18px 0; }
    .kv { display: grid; grid-template-columns: 148px 1fr; gap: 8px 12px; font-size: 13px; align-items: start; margin-bottom: 8px; }
    .kv dt { color: var(--text-3); padding-top: 2px; }
    .kv dd { color: var(--text); word-break: break-all; }
    .row-inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .reveal { border: none; background: none; color: var(--primary); cursor: pointer; font-size: 14px; }
    .block-title { font-size: 13px; font-weight: 650; margin: 16px 0 8px; }
    .sec-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 12px; }
    .sec-title-left { display: flex; align-items: center; gap: 8px; }
    .bank-table { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .bank-table table { width: 100%; }
    .bank-table th, .bank-table td { font-size: 12px; padding: 8px 10px; }
    .mod { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .mod-h { font-size: 14px; font-weight: 650; margin-bottom: 8px; }
    .mod-empty { color: var(--text-3); font-size: 13px; padding: 4px 0 2px; }
    .pdf-row { font-size: 12px; color: var(--text-2); margin-top: 8px; }
    .link { border: none; background: none; color: var(--primary); cursor: pointer; font-size: 12px; }
    .empty { padding: 24px 0; text-align: center; color: var(--text-3); font-size: 13px; }
    .toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%) translateY(-12px); background: #11233a; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; z-index: 95; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-horse"></i></div>
      <span>Extramile <em>eWealth Hub</em></span>
    </div>
    <div class="top-right">
      <button class="icon-btn" type="button"><i class="fa-regular fa-bell"></i></button>
      <button class="icon-btn" type="button"><i class="fa-solid fa-globe"></i></button>
      <span class="ccy">HKD <i class="fa-solid fa-angle-down" style="font-size:10px"></i></span>
      <div class="user"><div class="avatar">LP</div><span>LP LPOA002</span></div>
    </div>
  </header>

  <main class="page">
    <p class="proto">EWH-174 原型 · 点姓名旁图标打开客户信息；点交易账号进入持仓。结单在持仓页「交易记录」右侧 Tab。</p>
    <section class="card">
      <div class="filters">
        <input class="input" placeholder="请输入交易账号">
        <input class="input" placeholder="请输入英文名">
        <input class="input" placeholder="请输入中文名">
        <button class="btn btn-primary" type="button"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
        <button class="btn" type="button"><i class="fa-solid fa-rotate"></i> 重置</button>
        <button class="btn" type="button"><i class="fa-solid fa-upload"></i> 导出</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>排序</th><th>#</th><th>交易账号</th><th>姓名</th><th>备注</th>
              <th>总资产 (HKD)</th><th>总资产 (USD)</th><th>总资产 (CNH)</th>
              <th>投资移民账户</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
      <div class="pager">
        <span id="listPagerText">显示第 1-7 条，共 7 条</span>
        <div class="pager-btns">
          <span class="page-num">1</span>
          <select class="mini"><option>10 条/页</option></select>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
  <script>
    const body = document.getElementById('listBody');
    body.innerHTML = EWH.LIST.map((id, i) => {
      const c = EWH.getClient(id);
      const name = c.subject === '机构账户' && c.institution ? c.institution.nameCn : c.nameCn;
      const nameEn = c.subject === '机构账户' && c.institution ? c.institution.nameEn : c.nameEn;
      return `<tr>
        <td><i class="fa-solid fa-grip-vertical drag"></i></td>
        <td>${i + 1}</td>
        <td><a href="client-detail.html?id=${c.id}">${c.account}</a> <i class="fa-regular fa-copy copy"></i></td>
        <td>
          <div class="name-cell">
            <button class="info-ico" type="button" title="客户信息" onclick="EWH.openInfo('${c.id}')"><i class="fa-regular fa-address-card"></i></button>
            <div class="name-stack">
              <a href="client-detail.html?id=${c.id}">${nameEn}</a>
              <a href="client-detail.html?id=${c.id}">${name}</a>
            </div>
          </div>
        </td>
        <td>${c.remark}</td>
        <td class="num">${c.assets.hkd}</td>
        <td class="num">${c.assets.usd}</td>
        <td class="num">${c.assets.cnh}</td>
        <td><span class="pill ${c.immigrant ? 'pill-yes' : 'pill-no'}">${c.immigrant ? '是' : '否'}</span></td>
        <td><a class="op" href="client-detail.html?id=${c.id}&tab=stmt" title="结单"><i class="fa-regular fa-folder"></i></a></td>
      </tr>`;
    }).join('');
    EWH.bindKeys();
  </script>
</body>
</html>
